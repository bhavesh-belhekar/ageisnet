version: 0.1

risk_scoring:
  severity_levels:
    low: 1
    medium: 2
    high: 3
  component_weights:
    rule_hit: 1
    ml_flow_anomaly: 1
    ml_graph_anomaly: 1
  severity_tiers:
    low_min: 0
    medium_min: 2
    high_min: 4
  hard_height_override: true

delivery:
  push_min_severity: medium

windows:
  flow_model_feature_minutes: 5
  graph_baseline_hours: 24
  port_scan_window_seconds: 30

ml_thresholds:
  flow_model_anomaly_threshold: 0.6
  graph_new_edge_threshold: 1.0

false_positives:
  fp_target_on_clean_baseline: 0.10

rules:
  known_bad_ports:
    - 23    # telnet
    - 445   # SMB
    - 3389  # RDP

  restricted_ports:
    - 22    # SSH
    - 3389  # RDP

  restricted_connections:
    - dst_container: "demo-db"
      dst_port: 5432
      allowed_sources:
        - "bfa91286e27b"   # demo-api (12-char docker container ID)
      description: "Only demo-api may reach demo-db:5432"

  port_scan_threshold: 5
  port_scan_window_seconds: 30