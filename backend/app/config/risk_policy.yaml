  graph_baseline_hours: 24
  port_scan_window_seconds: 30

ml_thresholds:
  flow_model_anomaly_threshold: 0.6
  graph_new_edge_threshold: 1.0

false_positives:
  fp_target_on_clean_baseline: 0.10