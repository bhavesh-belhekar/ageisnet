version: 1.0

# Canonical definitions for MITRE ATT&CK techniques used across AegisNet detections
techniques:
  T1071:
    technique_id: "T1071"
    technique_name: "Application Layer Protocol"
    tactic_id: "TA0011"
    tactic_name: "Command and Control"
  T1071.001:
    technique_id: "T1071.001"
    technique_name: "Web Protocols"
    tactic_id: "TA0011"
    tactic_name: "Command and Control"
  T1043:
    technique_id: "T1043"
    technique_name: "Commonly Used Port"
    tactic_id: "TA0011"
    tactic_name: "Command and Control"
  T1046:
    technique_id: "T1046"
    technique_name: "Network Service Discovery"
    tactic_id: "TA0007"
    tactic_name: "Discovery"
  T1571:
    technique_id: "T1571"
    technique_name: "Non-Standard Port"
    tactic_id: "TA0011"
    tactic_name: "Command and Control"
  T1041:
    technique_id: "T1041"
    technique_name: "Exfiltration Over C2 Channel"
    tactic_id: "TA0010"
    tactic_name: "Exfiltration"
  T1021:
    technique_id: "T1021"
    technique_name: "Remote Services"
    tactic_id: "TA0008"
    tactic_name: "Lateral Movement"

# Mapping from detection category and specific type to technique ID
detection_type_to_technique:
  rule:
    known_bad_ip_connection: "T1071"
    known_bad_port: "T1043"
    port_scan: "T1046"
    restricted_protocol: "T1571"
  ml:
    flow_beaconing: "T1071.001"
    flow_exfiltration_spike: "T1041"
    graph_lateral_movement: "T1021"
    graph_unseen_edge: "T1021"
    graph_sensitive_port: null        # Insufficient evidence on connection alone (no T1078)
    graph_lateral_path: "T1021"         # Remote Services — multi-hop remote connection
    graph_internal_recon: "T1046"       # Network Service Discovery — internal port scanning
  fallback:
    ml_flow_anomaly: "T1071"
    ml_graph_anomaly: "T1021"
